name: Tests y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Se republica todos los días para actualizar el dólar y la UI del BCU.
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Muestra que el servicio del BCU responde; si falla no frena el PR,
      # la página usa la cotización de respaldo.
      - name: Probar cotizaciones del BCU
        continue-on-error: true
        run: node scripts/cotizaciones.js

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, test-backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Armar el sitio
        run: mkdir _site && cp -r index.html financiamiento.html CNAME css js img _site/
      - name: Bajar dólar y UI del BCU
        continue-on-error: true
        run: node scripts/cotizaciones.js _site/data/cotizaciones.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
